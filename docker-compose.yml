services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
    container_name: clinical-pipeline-kafka
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
      
  console:
    image: docker.redpanda.com/redpandadata/console:v2.5.2
    container_name: clinical-pipeline-console
    environment:
      KAFKA_BROKERS: "redpanda:29092"
    ports:
      - "8085:8080"
    depends_on:
      - redpanda

  postgres:
    image: postgres:16-alpine
    container_name: clinical-pipeline-db
    environment:
      POSTGRES_DB: clinical_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: clinical-pipeline-redis
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: clinical-pipeline-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.4.1
    container_name: clinical-pipeline-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    depends_on:
      - prometheus